<div class="card" style="margin-top:24px;">
  <label class="field-label">RE-RUN FULL SETUP</label>
  <p class="footnote" style="text-align:left; max-width:none; margin:8px 0 14px;">
    Walks through all four setup steps again — Discord, your media server, and libraries.
    Only rewrites those three (plus your Discord/media-server tokens in .env);
    render defaults, subtitle matching, and cache/sync settings on the other
    tabs here are left untouched.
  </p>
  <form method="post" action="/wizard/restart" style="display:inline-block;">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <button type="submit" class="btn-secondary" style="display:inline-flex;">
      Re-run setup wizard &rarr;
    </button>
  </form>
</div>
