<div id="preview-block">
  <div class="field-row" style="align-items:center; justify-content:space-between; margin-bottom:6px;">
    {% if background_title %}
    <p class="footnote" style="text-align:left; max-width:none; margin:0;">Preview background: {{ background_title }}</p>
    {% else %}
    <span></span>
    {% endif %}
    <button type="button" class="btn-edit-row" title="Shuffle preview background"
      hx-get="/styles/preview-background-fragment" hx-target="#preview-block" hx-swap="outerHTML">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="M18 2l4 4-4 4"/><path d="M2 6h1.4c1.3 0 2.5.6 3.3 1.7l.8 1.1"/><path d="M14.8 14.7l.8 1.1c.8 1.1 2 1.7 3.3 1.7H22"/><path d="M18 22l4-4-4-4"/></svg>
    </button>
  </div>
  <input type="hidden" id="background_id" name="background_id" value="{{ background_id or '' }}">
  <div id="style-preview" style="margin-bottom:20px;"
    hx-post="/styles/preview"
    hx-trigger="load, change from:closest form delay:500ms, input from:closest form delay:500ms"
    hx-target="#style-preview" hx-swap="innerHTML" hx-include="closest form"></div>
</div>
