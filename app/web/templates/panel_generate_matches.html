<div id="generate-right" class="card preview-card">
  <label class="field-label">PICK A LINE</label>
  <div class="match-list">
  {% for m in matches %}
    <form hx-post="/generate/render" hx-target="#generate-right" hx-swap="outerHTML">
      <input type="hidden" name="media_id" value="{{ m.media_id if show_titles else media_id }}">
      <input type="hidden" name="title" value="{{ m.title if show_titles else title }}">
      <input type="hidden" name="library_name" value="{{ m.library_name if show_titles else (library_name or '') }}">
      <input type="hidden" name="timecode" value="{{ m.start }}">
      <input type="hidden" name="display_timecode" value="{{ m.timecode }}">
      <input type="hidden" name="duration" value="{{ m.end - m.start }}">
      <input type="hidden" name="format" value="{{ format or '' }}">
      <input type="hidden" name="style" value="{{ style or 'classic' }}">
      <input type="hidden" name="caption" value="{{ m.text }}">
      <button type="submit" class="match-row">
        <span class="btn-spinner"></span>
        <span class="btn-label-idle" style="display:contents;">
          {% if show_titles %}<span class="match-title">{{ m.title }} &mdash; {{ m.library_name }}</span>{% endif %}
          <span class="match-text">{{ m.text }}</span>
          <span class="match-meta">{{ m.timecode }} &middot; {{ m.score | round(0) }}%</span>
        </span>
      </button>
    </form>
  {% endfor %}
  </div>
</div>
