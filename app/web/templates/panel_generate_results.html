<div class="result-list">
{% for r in results %}
  <button type="button" class="result-row"
    hx-get="/generate/select?rating_key={{ r.rating_key }}&kind={{ kind }}&title={{ r.title | urlencode }}&year={{ r.year or '' }}&library_name={{ r.library_name | urlencode }}"
    hx-target="#generate-form-area" hx-swap="innerHTML">
    <span class="result-title">{{ r.title }}{% if r.year %} ({{ r.year }}){% endif %}</span>
    <span class="result-lib">{{ r.library_name }}</span>
  </button>
{% else %}
  <p class="footnote" style="margin:8px 0;">No results.</p>
{% endfor %}
</div>
