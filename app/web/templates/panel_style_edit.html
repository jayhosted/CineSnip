<div id="styles-content">
  <div class="page-header"><h1>Subtitle Styles</h1><p>Edit built-in presets or add your own, including a custom font.</p></div>

  {% if error %}<div class="error-banner" style="margin-top:18px;">{{ error }}</div>{% endif %}
  {% if font_warning %}<div class="error-banner" style="margin-top:18px;">{{ font_warning }}</div>{% endif %}

  <form class="card" style="margin-top:18px; max-width:560px;"
    hx-post="/styles/save" hx-target="#styles-content" hx-swap="outerHTML">
    <input type="hidden" name="original_name" value="{{ original_name }}">

    <label class="field-label" for="name">NAME</label>
    <input type="text" id="name" name="name" value="{{ preset.name if preset else '' }}"
      {% if preset and preset.builtin %}readonly{% endif %} style="margin:6px 0 16px;">

    <div class="field-row" style="margin-bottom:16px;">
      <div style="flex:1;">
        <label class="field-label" for="font">FONT</label>
        <input type="text" id="font" name="font"
          value="{{ uploaded_font_family or (preset.font if preset else 'Liberation Sans') }}"
          style="margin-top:6px;">
      </div>
      <div style="flex:1;">
        <label class="field-label" for="font_size">FONT SIZE</label>
        <input type="text" id="font_size" name="font_size" value="{{ preset.font_size if preset else 26 }}" style="margin-top:6px;">
      </div>
    </div>

    <label class="field-label" style="display:block; margin-bottom:6px;">UPLOAD CUSTOM FONT (.ttf/.otf)</label>
    {% if original_name %}
    <div class="field-row" style="margin-bottom:16px;">
      <input type="file" name="font_file" accept=".ttf,.otf">
      <button class="btn btn-secondary" type="submit"
        hx-post="/styles/{{ original_name }}/font" hx-target="#styles-content" hx-swap="outerHTML"
        hx-encoding="multipart/form-data">Upload font</button>
    </div>
    {% else %}
    <p style="margin:0 0 16px; color:var(--text-muted, #888);">Save the preset first, then you can upload a custom font.</p>
    {% endif %}

    <div class="field-row" style="margin-bottom:16px;">
      <div style="flex:1;">
        <label class="field-label" for="primary_color">TEXT COLOR (ASS &amp;HAABBGGRR)</label>
        <div style="display:flex; gap:8px; margin-top:6px;">
          <input type="color" class="color-swatch" data-color-picker-for="primary_color" aria-label="Pick text color">
          <input type="text" id="primary_color" name="primary_color" value="{{ preset.primary_color if preset else '&H00FFFFFF' }}" style="flex:1;">
        </div>
      </div>
      <div style="flex:1;">
        <label class="field-label" for="outline_color">OUTLINE COLOR</label>
        <div style="display:flex; gap:8px; margin-top:6px;">
          <input type="color" class="color-swatch" data-color-picker-for="outline_color" aria-label="Pick outline color">
          <input type="text" id="outline_color" name="outline_color" value="{{ preset.outline_color if preset else '&H00000000' }}" style="flex:1;">
        </div>
      </div>
    </div>

    <div class="field-row" style="margin-bottom:16px;">
      <div style="flex:1;">
        <label class="field-label" for="back_color">BOX COLOR</label>
        <div style="display:flex; gap:8px; margin-top:6px;">
          <input type="color" class="color-swatch" data-color-picker-for="back_color" aria-label="Pick box color">
          <input type="text" id="back_color" name="back_color" value="{{ preset.back_color if preset else '&H00000000' }}" style="flex:1;">
        </div>
      </div>
      <div style="flex:1;">
        <label class="field-label" for="border_style">BORDER STYLE (1=outline, 3=box)</label>
        <input type="text" id="border_style" name="border_style" value="{{ preset.border_style if preset else 1 }}" style="margin-top:6px;">
      </div>
    </div>

    <div class="field-row" style="margin-bottom:16px;">
      <div style="flex:1;">
        <label class="field-label" for="outline">OUTLINE WIDTH</label>
        <input type="text" id="outline" name="outline" value="{{ preset.outline if preset else 2.0 }}" style="margin-top:6px;">
      </div>
      <div style="flex:1;">
        <label class="field-label" for="shadow">SHADOW</label>
        <input type="text" id="shadow" name="shadow" value="{{ preset.shadow if preset else 0.0 }}" style="margin-top:6px;">
      </div>
    </div>

    <div class="field-row" style="margin-bottom:16px;">
      <label><input type="checkbox" name="bold" {% if preset and preset.bold %}checked{% endif %}> Bold</label>
      <label><input type="checkbox" name="uppercase" {% if preset and preset.uppercase %}checked{% endif %}> Uppercase</label>
    </div>

    <div class="field-row" style="margin-bottom:20px;">
      <div style="flex:1;">
        <label class="field-label" for="margin_v">BOTTOM MARGIN (px)</label>
        <input type="text" id="margin_v" name="margin_v" value="{{ preset.margin_v if preset else 24 }}" style="margin-top:6px;">
      </div>
      <div style="flex:1;">
        <label class="field-label" for="alignment">ALIGNMENT (ASS numpad code)</label>
        <input type="text" id="alignment" name="alignment" value="{{ preset.alignment if preset else 2 }}" style="margin-top:6px;">
      </div>
    </div>

    <div id="style-preview" style="margin-bottom:20px;"
      hx-post="/styles/preview"
      hx-trigger="load, change from:closest form delay:500ms, input from:closest form delay:500ms"
      hx-target="#style-preview" hx-swap="innerHTML" hx-include="closest form"></div>

    <button class="btn btn-primary" type="submit">Save</button>
    <a href="/styles" class="btn btn-secondary">Cancel</a>
  </form>
</div>

<script>
(function () {
  // ASS colours are &HAABBGGRR (alpha-blue-green-red, alpha 00=opaque) —
  // a different byte order and alpha convention from the #RRGGBB a native
  // <input type="color"> speaks, so each picker is paired with its text
  // field via conversion here rather than binding the picker directly to
  // the form value. The text field stays the source of truth (still
  // editable by hand for an exact hex/alpha value); the picker is a
  // convenience that reads from and writes back into it.
  function assToRgbHex(ass) {
    var m = /^&H([0-9A-Fa-f]{8})$/.exec((ass || '').trim());
    if (!m) return null;
    var hex = m[1];
    return '#' + hex.slice(6, 8) + hex.slice(4, 6) + hex.slice(2, 4);
  }
  function assAlpha(ass) {
    var m = /^&H([0-9A-Fa-f]{8})$/.exec((ass || '').trim());
    return m ? m[1].slice(0, 2) : '00';
  }
  function rgbHexToAss(hex, alpha) {
    var m = /^#([0-9A-Fa-f]{6})$/.exec(hex || '');
    if (!m) return null;
    var rr = m[1].slice(0, 2), gg = m[1].slice(2, 4), bb = m[1].slice(4, 6);
    return ('&H' + alpha + bb + gg + rr).toUpperCase();
  }

  document.querySelectorAll('[data-color-picker-for]').forEach(function (picker) {
    var textInput = document.getElementById(picker.getAttribute('data-color-picker-for'));
    if (!textInput) return;

    var initial = assToRgbHex(textInput.value);
    if (initial) picker.value = initial;

    picker.addEventListener('input', function () {
      var newAss = rgbHexToAss(picker.value, assAlpha(textInput.value));
      if (!newAss) return;
      textInput.value = newAss;
      // A real 'input' event so htmx's existing "input from:closest form"
      // trigger on #style-preview picks this up like any typed change.
      textInput.dispatchEvent(new Event('input', { bubbles: true }));
    });

    textInput.addEventListener('input', function () {
      var hex = assToRgbHex(textInput.value);
      if (hex) picker.value = hex;
    });
  });
})();
</script>
